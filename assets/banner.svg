<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Soft Filter Blur -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #f8fafc;
    }

    /* Ambient Dynamic Pulsing */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(-40px, 25px) scale(1.2); opacity: 0.5; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; }
    .float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .float-2 { animation: floatCard2 6s ease-in-out infinite; }
    .data-stream {
      stroke-dasharray: 8 12;
      animation: dashStream 15s linear infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="200" cy="120" r="160" fill="#6366f1" />
    <circle class="orb-2" cx="1020" cy="300" r="180" fill="#a855f7" />
    <circle class="orb-1" cx="620" cy="380" r="140" fill="#ec4899" opacity="0.25" />
  </g>

  <!-- Ambient Dynamic Flow Streams -->
  <path class="data-stream" d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
  <path class="data-stream" d="M 50 360 Q 400 410 750 350 T 1150 380" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Dynamic Decorative Visual Elements (Background/Sides) -->
  <g class="float-1" transform="translate(930, 60)">
    <rect width="210" height="90" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="28" cy="32" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
    <path d="M 24 32 L 27 35 L 33 29" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="28" class="card-label">Invoice Settled</text>
    <text x="48" y="48" class="card-value">$1,450.00 USD</text>
    <text x="24" y="74" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Self-Serve Portal • Instant</text>
  </g>

  <g class="float-2" transform="translate(60, 260)">
    <rect width="210" height="90" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="28" cy="32" r="10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <circle cx="28" cy="32" r="4" fill="#38bdf8" />
    <text x="48" y="28" class="card-label">Subscription Tier</text>
    <text x="48" y="48" class="card-value">Enterprise Plan</text>
    <text x="24" y="74" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Auto-Renew • Card Updated</text>
  </g>

  <!-- Foreground Content: Header, Badges, Title, Subtitle -->
  <g transform="translate(0, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(435, 68)">
      <rect width="330" height="34" rx="17" fill="#1e293b" stroke="url(#accentGlow)" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="36" y="22" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#e2e8f0" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" class="title-text" font-size="44">
      Customer Billing Self-Service Portal
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" text-anchor="middle" class="subtitle-text" font-size="19">
      Top SaaS Platforms &amp; Open-Source Projects for Subscription &amp; Invoice Portals
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(230, 265)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="40" rx="20" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="85" y="25" text-anchor="middle" class="pill-text">💳 Self-Serve Invoices</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="180" height="40" rx="20" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="90" y="25" text-anchor="middle" class="pill-text">🔄 Plan Management</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(380, 0)">
        <rect width="175" height="40" rx="20" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="87" y="25" text-anchor="middle" class="pill-text">⚡ Metered &amp; Usage</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(570, 0)">
        <rect width="170" height="40" rx="20" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="85" y="25" text-anchor="middle" class="pill-text">🛡️ Zero Lock-In OSS</text>
      </g>
    </g>

    <!-- Bottom Decorative Accent Bar -->
    <rect x="350" y="345" width="500" height="3" rx="1.5" fill="url(#accentGlow)" />
  </g>
</svg>
