acing:1px}.card-value{font-weight:700;font-size:16px;fill:#f8fafc}.orb-1{animation:pulseOrb1 9s ease-in-out infinite}.orb-2{animation:pulseOrb2 11s ease-in-out infinite}.float-1{animation:floatCard1 5s ease-in-out infinite}.float-2{animation:floatCard2 6s ease-in-out infinite}.data-stream{stroke-dasharray:8 12;animation:dashStream 15s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><g filter="url(#glow)"><circle cx="200" cy="120" r="160" fill="#6366f1" class="orb-1"/><circle cx="1020" cy="300" r="180" fill="#a855f7" class="orb-2"/><circle cx="620" cy="380" r="140" fill="#ec4899" class="orb-1" opacity=".25"/></g><path fill="none" stroke="#6366f1" stroke-opacity=".4" stroke-width="1.5" d="M 50 80 Q 300 20 600 80 T 1150 60" class="data-stream"/><path fill="none" stroke="#a855f7" stroke-opacity=".4" stroke-width="1.5" d="M 50 360 Q 400 410 750 350 T 1150 380" class="data-stream"/><g class="float-1" transform="translate(930, 60)"><rect width="210" height="90" fill="url(#cardGrad)" stroke="#475569" stroke-opacity=".5" stroke-width="1" rx="14"/><circle cx="28" cy="32" r="10" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width="2"/><path fill="none" stroke="#10b981" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 24 32 L 27 35 L 33 29"/><text x="48" y="28" class="card-label">Invoice Settled</text><text x="48" y="48" class="card-value">$1,450.00 USD</text><text x="24" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Self-Serve Portal • Instant</text></g><g class="float-2" transform="translate(60, 260)"><rect width="210" height="90" fill="url(#cardGrad)" stroke="#475569" stroke-opacity=".5" stroke-width="1" rx="14"/><circle cx="28" cy="32" r="10" fill="#38bdf8" fill-opacity=".2" stroke="#38bdf8" stroke-width="2"/><circle cx="28" cy="32" r="4" fill="#38bdf8"/><text x="48" y="28" class="card-label">Subscription Tier</text><text x="48" y="